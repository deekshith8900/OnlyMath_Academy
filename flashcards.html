<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Flashcards | OnlyMath Academy</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            max-width: 500px;
            height: 300px;
            margin: 0 auto 40px auto;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid;
        }

        .flashcard-front {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(16, 185, 129, 0.2));
            border-color: #38bdf8;
            color: white;
            font-size: 2rem;
            font-family: 'Outfit', sans-serif;
        }

        .flashcard-back {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(239, 68, 68, 0.2));
            border-color: #f59e0b;
            color: white;
            font-size: 1.5rem;
            transform: rotateY(180deg);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            max-width: 500px;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            margin: 0 auto 40px auto;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #38bdf8;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="dark-bg">

    <header id="header" style="background: rgba(10, 10, 22, 0.9);">
        <nav class="navbar container">
            <a href="index.html" class="logo">Σ <span>OnlyMath</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="quiz.html">Quizzes</a></li>
                <li><a href="graph.html">Graphing 📈</a></li>
                <li><a href="dashboard.html" class="btn btn-outline" style="margin-left: 1rem;">Dashboard</a></li>
            </ul>
        </nav>
    </header>

    <section class="section" style="margin-top: 80px; min-height: 80vh;">
        <div class="container">
            
            <div style="text-align: center; margin-bottom: 20px;">
                <h1 style="font-family: 'Outfit', sans-serif; font-size: 3rem; color: #10b981;">Flashcards</h1>
                <p style="color: #94a3b8; font-size: 1.2rem;">Test your memory. Complete the deck to earn +10 Bounties!</p>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="flashcard-container" id="flashcardContainer">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-front" id="cardFront">
                        Loading...
                    </div>
                    <div class="flashcard-back" id="cardBack">
                        Loading...
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" id="prevBtn"><i class='bx bx-left-arrow-alt'></i> Prev</button>
                <button class="btn btn-outline" id="flipBtn"><i class='bx bx-refresh'></i> Flip</button>
                <button class="btn btn-primary" id="nextBtn">Next <i class='bx bx-right-arrow-alt'></i></button>
            </div>
            
            <div id="rewardMsg" style="text-align: center; color: #f59e0b; font-size: 1.5rem; font-weight: bold; display: none; margin-top: 20px;">
                🎉 Deck Completed! +10 Bounties Added!
            </div>

        </div>
    </section>

    <script src="flashcards.js"></script>
</body>
</html>
